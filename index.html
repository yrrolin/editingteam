<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rudrakrit · Edit Board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#141416;--line:#26262a;--text:#f2efe9;--mute:#8d8b86;--accent:#f2efe9;--accent-ink:#0b0b0c;
--pending:#c9a227;--editing:#4c8dff;--review:#b36bff;--done:#3fb97a;--font:'Inter Tight',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 20px 60px}
.wrap{max-width:960px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 40px}
.brand{font-weight:600;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--mute);font-weight:400;margin-left:10px}
h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.035em;font-weight:500;margin-bottom:12px}
.sub{color:var(--mute);margin-bottom:36px;max-width:520px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
input:focus,select:focus{outline:1px solid var(--text)}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 18px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:hover{border-color:var(--text)}
button:disabled{opacity:.55;cursor:wait}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#search{max-width:100%}
.login{max-width:380px;display:grid;gap:12px}
.add{display:grid;grid-template-columns:2fr 1.5fr 2fr auto;gap:10px;margin-bottom:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.row{display:grid;grid-template-columns:2.2fr 1.2fr 1.3fr 1.2fr auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.row .t{font-weight:500}.row .c,.row .e{color:var(--mute);font-size:14px}
.row a{color:var(--text);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.acts{display:flex;gap:6px}.acts button{padding:6px 12px;font-size:13px}
.msg{color:#ff7a7a;font-size:14px;min-height:18px}.notice{padding:13px 15px;border:1px solid #713d3d;background:#241516;color:#ffbcbc;border-radius:10px;margin:0 0 18px;line-height:1.45}.notice.ok{border-color:#315d46;background:#122018;color:#a9e8bf}.notice.warn{border-color:#76602e;background:#211c10;color:#f1d48a}
.empty{color:var(--mute);padding:40px 0;border-top:1px solid var(--line)}
footer{margin-top:60px;color:var(--mute);font-size:13px}
.hide{display:none!important}
@media(max-width:720px){.add{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr;gap:8px}.acts{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">Rudrakrit<span>Edit Board</span></div><nav style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a id="dashlink" href="dashboard.html" style="color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px">Dashboard ↗</a><button id="out" class="hide">Sign out</button></nav></header>
  <h1>Every edit,<br>one clear board.</h1>
  <p class="sub">See what’s pending, who’s editing it, and where it stands. Updates appear live for the whole team.</p>

  <div id="notice" class="notice hide" role="alert" aria-live="polite"></div>
  <form id="login" class="login">
    <input id="em" type="email" placeholder="Team email" required>
    <input id="pw" type="password" placeholder="Password" required>
    <button class="primary">Sign in</button>
    <div class="msg" id="lmsg"></div>
  </form>

  <main id="board" class="hide">
    <form class="add" id="add">
      <input id="n-title" placeholder="Video title" required>
      <input id="n-client" placeholder="Client / project">
      <input id="n-link" type="url" placeholder="Raw footage / Drive link">
      <button class="primary">Add video</button>
    </form>
    <input id="search" type="search" placeholder="Search videos, clients or editors…" aria-label="Search videos" style="margin-bottom:14px">
    <div class="tabs" id="tabs"></div>
    <div id="list" aria-live="polite"></div>
  </main>
  <footer>© 2026 Rudrakrit. Consider it handled.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://tkpjhvvxucjfepxnhfkr.supabase.co';
const SUPABASE_KEY='sb_publishable_R8AFI-C_B3DyRExE38jotg_qwi9QgiF';
const STATUSES=['Pending','Editing','Review','Done'];
const COLORS={Pending:'--pending',Editing:'--editing',Review:'--review',Done:'--done'};
const $=id=>document.getElementById(id);
let me=null,role=null,rows=[],filter='All',channel=null,loginBusy=false,addBusy=false,loading=false;
function notify(message,type='error'){
  const box=$('notice'); box.textContent=message; box.className='notice'+(type==='ok'?' ok':type==='warn'?' warn':'');
}
function clearNotice(){const box=$('notice');box.textContent='';box.className='notice hide';}
function explainError(error,context=''){
  const raw=error?.message||error?.error_description||String(error||'Unknown error');
  const msg=raw.toLowerCase();
  if(msg.includes('invalid login credentials')) return 'Email or password is incorrect. Check the account under Supabase → Authentication → Users.';
  if(msg.includes('email not confirmed')) return 'This account’s email is not confirmed. Confirm it in Supabase Authentication, or disable email confirmation for testing.';
  if(msg.includes('user not found')) return 'No account exists for this email. Create the editor account in Supabase → Authentication → Users.';
  if(msg.includes('failed to fetch')||msg.includes('network')) return 'Could not reach Supabase. Check your internet connection, Project URL, and whether the Supabase project is active.';
  if(msg.includes('invalid api key')||msg.includes('apikey')) return 'Supabase rejected the API key. Verify that the publishable key belongs to this exact project.';
  if(msg.includes('relation')&&msg.includes('does not exist')) return 'Login succeeded, but the videos table is missing. Create public.videos in Supabase SQL Editor.';
  if(msg.includes('row-level security')||msg.includes('permission denied')||msg.includes('not allowed')) return 'Supabase blocked this database action. Check the videos table’s RLS policies for the authenticated role.';
  if(msg.includes('column')&&msg.includes('does not exist')) return 'The videos table schema does not match this app. Check that it has title, client, footage_url, editor_name, status, and created_at columns.';
  const extra=[error?.code,error?.details,error?.hint].filter(Boolean).join(' · ');
  return (context?context+': ':'')+raw+(extra?' ('+extra+')':'');
}
if(!window.supabase?.createClient){
  notify('The Supabase client library did not load. Check your connection or CDN access, then refresh.'); throw new Error('Supabase JS client unavailable');
}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const myName=()=>{const n=me?.user_metadata?.name||me?.email?.split('@')[0]||'Editor';return n.charAt(0).toUpperCase()+n.slice(1);};

$('login').onsubmit=async e=>{
  e.preventDefault(); if(loginBusy)return;
  clearNotice(); loginBusy=true;
  const button=$('login').querySelector('button');button.disabled=true;button.textContent='Signing in…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error) throw error;
    if(data.user) notify('Signed in successfully. Loading your board…','ok');
    else notify('Supabase did not return a user session. Check Authentication settings.');
  }catch(error){notify(explainError(error,'Sign-in failed'));}
  finally{loginBusy=false;button.disabled=false;button.textContent='Sign in';}
};
$('out').onclick=async()=>{
  try{const {error}=await sb.auth.signOut();if(error)throw error;notify('You have signed out.','ok');}
  catch(error){notify(explainError(error,'Sign-out failed'));}
};

sb.auth.onAuthStateChange((event,session)=>{
  me=session?.user||null;
  $('login').classList.toggle('hide',!!me);
  $('board').classList.toggle('hide',!me);
  $('out').classList.toggle('hide',!me);
  if(me){
    if(event==='SIGNED_IN') notify('Login successful. Checking your role…','ok');
    if(event==='SIGNED_IN'||event==='INITIAL_SESSION') setTimeout(async()=>{
      try{
        const {data,error}=await sb.from('team_members').select('role').eq('user_id',me.id).single();
        if(error)throw error; role=data.role;
        if(role==='client'){location.replace('dashboard.html');return;}
        if(!['owner','editor'].includes(role))throw new Error('This account has no permitted Rudrakrit role.');
        $('add').classList.toggle('hide',role!=='owner'&&role!=='editor');
        $('dashlink').classList.toggle('hide',role==='client');
        await load();if(!channel)startRealtime();
      }catch(error){notify(explainError(error,'Role check failed. Run the Supabase roles migration first'));await sb.auth.signOut();}
    },0);
  }else{
    rows=[];render();
    if(channel){sb.removeChannel(channel);channel=null;}
  }
});

async function load(){
  if(loading)return;
  loading=true;$('list').innerHTML='<div class="empty">Loading videos…</div>';
  try{
    const {data,error}=await sb.from('videos').select('*').order('created_at',{ascending:false});
    if(error)throw error;
    rows=data||[];render();
    if(!rows.length) notify('Connected to Supabase. No videos yet — add your first video.','ok');
    else clearNotice();
  }catch(error){notify(explainError(error,'Could not load videos'));}
  finally{loading=false;}
}
function startRealtime(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('videos-board')
    .on('postgres_changes',{event:'*',schema:'public',table:'videos'},()=>load())
    .subscribe(status=>{
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')notify('Live updates are unavailable. Refresh the page or check Supabase Realtime settings.','warn');
    });
}
$('add').onsubmit=async e=>{
  e.preventDefault();if(addBusy)return;clearNotice();
  const rawLink=$('n-link').value.trim();
  if(rawLink){try{const u=new URL(rawLink);if(!['http:','https:'].includes(u.protocol))throw new Error();}catch{notify('Enter a valid http or https footage link.');$('n-link').focus();return;}}
  addBusy=true;
  const button=$('add').querySelector('button');button.disabled=true;button.textContent='Adding…';
  try{
    const {error}=await sb.from('videos').insert({
      title:$('n-title').value.trim(),client:$('n-client').value.trim(),
      footage_url:$('n-link').value.trim()||null,editor_id:role==='editor'?me.id:null
    });
    if(error)throw error;
    e.target.reset();notify('Video added successfully.','ok');await load();
  }catch(error){notify(explainError(error,'Could not add video'));}
  finally{addBusy=false;button.disabled=false;button.textContent='Add video';}
};
async function updateVideo(id,patch){
  const {data,error}=await sb.from('videos').update(patch).eq('id',id).select('id');
  if(error)throw error;
  if(!data?.length)throw new Error('No row was updated. You may not have permission, or the video may have been removed.');
  await load();
}
window.act=async(id,action,value)=>{
  clearNotice();
  try{
    if(action==='take'){
      const {error}=await sb.rpc('claim_video',{p_video_id:String(id)});if(error)throw error;await load();
    }
    if(action==='release'&&role==='owner')await updateVideo(id,{editor_id:null,editor_name:null,status:'Pending'});
    if(action==='release'&&role==='editor'){const {error}=await sb.rpc('release_video',{p_video_id:String(id)});if(error)throw error;await load();}
    if(action==='status')await updateVideo(id,{status:value});
    if(action==='del'&&(role==='owner'||(role==='editor'&&rows.find(r=>String(r.id)===String(id))?.editor_id===me?.id))&&confirm('Delete this video?')){
      const {error}=await sb.from('videos').delete().eq('id',id);
      if(error)throw error;await load();notify('Video deleted.','ok');
    }
  }catch(error){notify(explainError(error,'Action failed'));}
};

function render(){
  $('tabs').innerHTML=['All',...STATUSES].map(s=>{
    const n=s==='All'?rows.length:rows.filter(r=>r.status===s).length;
    return `<button type="button" class="filter-btn ${s===filter?'on':''}" data-filter="${s}">${s} · ${n}</button>`;
  }).join('');
  const q=$('search').value.trim().toLowerCase();
  const visible=rows.filter(r=>(filter==='All'||r.status===filter)&&[r.title,r.client,r.editor_name].some(v=>String(v||'').toLowerCase().includes(q)));
  $('list').innerHTML=visible.length?visible.map(r=>{
    let footage='';
    try{const u=new URL(r.footage_url);if(['http:','https:'].includes(u.protocol))footage=`<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">Footage ↗</a>`;}catch{}
    const canManage=role==='owner'||(role==='editor'&&r.editor_id===me?.id);
    const canClaim=role==='editor'&&!r.editor_id;
    return `<div class="row" data-row-id="${esc(r.id)}">
      <div><div class="t">${esc(r.title)}</div>${footage}</div>
      <div class="c">${esc(r.client)||'—'}</div>
      <div class="e">${r.editor_name?esc(r.editor_name):'Unassigned'}</div>
      <div><span class="dot" style="background:var(${COLORS[r.status]||'--pending'})"></span>${canManage?`<select aria-label="Status for ${esc(r.title)}" data-action="status" style="width:auto;padding:6px 10px">${STATUSES.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>`:`<span>${esc(r.status||'Pending')}</span>`}</div>
      <div class="acts">${canClaim?`<button type="button" data-action="take">I’ll edit</button>`:''}${(role==='owner'&&(r.editor_id||r.editor_name)||(role==='editor'&&r.editor_id===me?.id))?`<button type="button" data-action="release">Release</button>`:''}${canManage?`<button type="button" data-action="del" aria-label="Delete ${esc(r.title)}">✕</button>`:''}</div>
    </div>`;
  }).join(''):'<div class="empty">No matching videos. Try another search or filter.</div>';
}
$('search').addEventListener('input',render);
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;render();});
$('list').addEventListener('change',e=>{if(e.target.matches('[data-action="status"]')){const row=e.target.closest('[data-row-id]');if(row)act(row.dataset.rowId,'status',e.target.value);}});
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const row=b.closest('[data-row-id]');if(row)act(row.dataset.rowId,b.dataset.action);});
render();
</script>
</body>
</html>
